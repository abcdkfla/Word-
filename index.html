function nav(){let items=[['home','홈'],['list','단어장'],['settings','설정']];$('#nav').hidden=state.screen==='quiz'||state.screen==='cards';$('#nav').innerHTML=items.map(([k,label])=>`<button class="${state.screen===k?'active':''}" data-nav="${k}"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[k==='list'?'book':k]}</svg>${label}</button>`).join('')}
function home(){return `<h1 class="title">월요일 시험 준비</h1><p class="sub">10월 12일 시험</p><h2 class="section">시험 구성</h2><div class="home-exams"><div class="exam-row"><span>p.30–33 · 영어로 쓰기</span><span>16문제 · 8점</span></div><div class="exam-row"><span>p.162 · 영어로 쓰기</span><span>8문제 · 4점</span></div><div class="exam-row"><span>p.162 · 우리말로 쓰기</span><span>10문제 · 5점</span></div></div><h2 class="section">교재 페이지</h2><div class="home-pages">${['30','31','32','33','162'].map(p=>`<button class="home-page" data-page="${p}"><span class="page-number">p.${p}</span><span class="page-info">${p==='162'?'형용사 표현':'빈출 표현'}<span class="page-progress"><i style="width:${100*learned(p)/words(p).length}%"></i></span></span><span class="count">${learned(p)} / ${words(p).length}</span></button>`).join('')}</div>`}
function list(){let p=state.page,filtered=words().filter(w=>(state.kind==='all'||w.kind===state.kind)&&(state.filter==='all'||(state.filter==='yes'&&!!state.learned[w.id])||(state.filter==='no'&&!state.learned[w.id])||(state.filter==='frequent'&&stat(w).wrong>0)));if(state.filter==='frequent')filtered.sort((a,b)=>recentWrong(b)-recentWrong(a)||stat(b).wrong-stat(a).wrong);return `<h1 class="title">단어장</h1><div class="pages-strip">${['30','31','32','33','162'].map(n=>`<button class="${p===n?'selected':''}" data-page="${n}">p.${n}</button>`).join('')}</div><div class="page-head"><h2>p.${p} ${p==='162'?'형용사 표현':'빈출 표현'}</h2><p>외운 단어 ${learned(p)} / ${words(p).length}</p></div><div class="filters">${[['all','전체'],['no','안 외운 단어'],['yes','외운 단어'],['frequent','자주 틀린 단어']].map(([v,t])=>`<button class="${state.filter===v?'selected':''}" data-filter="${v}">${t}</button>`).join('')}</div>${p==='162'?`<select class="kind" id="kind"><option value="all">전체 표현</option><option value="prep" ${state.kind==='prep'?'selected':''}>be + 형용사 + 전치사</option><option value="adj" ${state.kind==='adj'?'selected':''}>분사·헷갈리는 형용사</option></select>`:''}<div class="vocab-list">${filtered.length?filtered.map(w=>`<div class="vocab-row"><button class="vocab-text" data-detail="${w.id}"><strong>${safe(w.ko)}</strong>${stat(w).wrong?`<span class="wrong">오답 ${stat(w).wrong}회</span>`:''}<small>${safe(w.en)}</small></button><button class="check ${state.learned[w.id]?'yes':''}" data-learn="${w.id}" aria-label="${safe(w.ko)} ${state.learned[w.id]?'외운 단어 취소':'외운 단어 표시'}">${state.learned[w.id]?'✓':''}</button></div>`).join(''):'<div class="empty">해당하는 단어가 없어요.</div>'}</div><div class="sticky-quiz"><div class="card-actions"><button class="secondary" id="page-cards">카드로 암기</button><button class="primary" id="page-quiz">전체 단어 퀴즈</button></div><p>p.${p} 표현 ${words(p).length}개 모두 출제 · 암기 표시와 별도 기록</p></div>`}
function currentMode(w){return w.kind==='adj'?'ko':'en'}
function quiz(){let w=state.session[state.idx];if(!w)return `<div class="quiz-top"><button class="back" data-nav="list" aria-label="단어장으로">‹</button><strong>퀴즈 완료</strong></div><h1 class="title" style="margin-top:55px">${state.session.length}개 표현 완료</h1><p class="sub">이번 퀴즈 · 정답 ${state.sessionResults.correct}회 · 오답 ${state.sessionResults.wrong}회</p><div class="actions" style="margin-top:30px"><button class="primary" id="restart">다시 풀기</button><button class="secondary" data-nav="list">단어장으로</button></div>`;let en=currentMode(w)==='en',record=stat(w);return `<div class="quiz-top"><button class="back" data-nav="list" aria-label="단어장으로">‹</button><strong>p.${state.page} · 전체 단어 퀴즈</strong></div><div class="quiz-progress">${state.idx+1} / ${state.session.length}</div><div class="track"><i style="width:${100*(state.idx+1)/state.session.length}%"></i></div><div class="prompt">다음 표현을 ${en?'영어':'우리말'}로 쓰세요</div><h2 class="cue">${safe(en?w.ko:w.en)}</h2><input class="answer" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${en?'영어 표현':'우리말 뜻'} 입력" value="${safe(state.input)}" ${state.shown?'disabled':''}>${state.shown?`<div class="answerbox"><b>${state.verdict==='correct'?'정답 ✓':'오답 · 교재 정답'}</b>${safe(en?w.en:w.ko)}</div><button class="primary" id="next" style="margin-top:4px">다음 단어 →</button><p class="notice">퀴즈 기록만 저장 · 외운 단어 표시는 그대로</p><div class="stats-card"><h3>이 단어의 기록</h3><div class="statline"><span>정답</span><b>${record.correct}회</b></div><div class="statline"><span>오답</span><b>${record.wrong}회</b></div><div class="statline"><span>최근 ${Math.min(5,record.recent.length)}회 중 오답</span><b>${recentWrong(w)}회</b></div></div>`:`<button class="primary" id="reveal" style="margin-top:18px">정답 확인</button><p class="notice">입력한 답을 교재 정답과 비교해 자동 채점합니다.</p>`}`}
function cards(){let w=state.deck[state.cardIdx];if(!w)return `<div class="empty">카드가 없어요.</div>`;return `<div class="quiz-top"><button class="back" data-nav="list" aria-label="단어장으로">‹</button><strong>p.${state.page} · 카드로 암기</strong></div><div class="quiz-progress">${state.cardIdx+1} / ${state.deck.length}</div><div class="track"><i style="width:${100*(state.cardIdx+1)/state.deck.length}%"></i></div><div class="flash-wrap"><button class="flash ${state.flipped?'flipped':''}" id="flip" aria-label="카드 뒤집기"><span class="flash-face"><small>뜻 · 탭해서 뒤집기</small><strong>${safe(w.ko)}</strong></span><span class="flash-face flash-back"><small>영어 표현 · 탭해서 뒤집기</small><strong>${safe(w.en)}</strong></span></button></div><div class="flash-nav"><button class="secondary" id="prev-card" ${state.cardIdx===0?'disabled':''}>← 이전</button><button class="secondary" id="next-card" ${state.cardIdx===state.deck.length-1?'disabled':''}>다음 →</button></div><p class="notice">카드를 보는 것은 퀴즈 기록과 암기 상태를 변경하지 않아요.</p>`}
function settings(){return `<h1 class="title">설정</h1><h2 class="section">기록 저장</h2><div class="settings-block"><strong>이 브라우저에 자동 저장 중</strong><p class="sub">암기 표시와 단어별 정답·오답 횟수는 각자의 휴대폰 브라우저에 따로 저장됩니다. 같은 브라우저의 같은 사이트 주소로 접속해야 이어집니다.</p><div class="actions"><button class="secondary" id="backup">기록 백업</button><button class="secondary" id="import">기록 복원</button></div></div><h2 class="section">내 기록</h2><div class="settings-block">외운 단어 ${vocab.filter(w=>state.learned[w.id]).length}개<br>퀴즈 정답 ${Object.values(state.stats).reduce((n,r)=>n+(r.correct||0),0)}회 · 오답 ${Object.values(state.stats).reduce((n,r)=>n+(r.wrong||0),0)}회</div>`}
function detail(){let w=vocab.find(x=>x.id===state.detail);if(!w){$('#overlay').innerHTML='';return}let r=stat(w);$('#overlay').innerHTML=`<div class="sheet" id="sheet"><div class="sheet-inner"><div class="sheet-head"><strong>이 단어의 기록</strong><button id="close" aria-label="닫기">×</button></div><h2>${safe(w.ko)}</h2><p>${safe(w.en)} · p.${w.page}</p><div class="statline"><span>정답</span><b>${r.correct}회</b></div><div class="statline"><span>오답</span><b>${r.wrong}회</b></div><div class="statline"><span>최근 ${Math.min(5,r.recent.length)}회 중 오답</span><b>${recentWrong(w)}회</b></div><p class="notice">암기 상태는 단어장 오른쪽에서 직접 표시합니다.</p></div></div>`}
function render(){nav();$('#app').innerHTML=state.screen==='home'?home():state.screen==='list'?list():state.screen==='quiz'?quiz():state.screen==='cards'?cards():settings();detail()}
function startPageQuiz(){state.session=[...words(state.page)];state.idx=0;state.input='';state.shown=false;state.verdict=null;state.sessionResults={correct:0,wrong:0};state.screen='quiz';render()}
function notify(t){let d=document.createElement('div');d.className='notice';d.style.cssText='position:fixed;z-index:12;bottom:85px;left:50%;transform:translateX(-50%);background:#333;color:#fff;border-radius:8px;padding:10px 14px;white-space:nowrap';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b){if(e.target.id==='sheet'){state.detail=null;detail()}return}if(b.dataset.nav){state.screen=b.dataset.nav;state.detail=null;render()}else if(b.dataset.page){state.page=b.dataset.page;state.filter='all';state.kind='all';state.screen='list';render()}else if(b.dataset.filter){state.filter=b.dataset.filter;render()}else if(b.dataset.learn){state.learned[b.dataset.learn]=!state.learned[b.dataset.learn];save();render()}else if(b.dataset.detail){state.detail=b.dataset.detail;detail()}else if(b.id==='close'){state.detail=null;detail()}else if(b.id==='page-cards'){state.deck=[...words(state.page)];state.cardIdx=0;state.flipped=false;state.screen='cards';render()}else if(b.id==='flip'){state.flipped=!state.flipped;render()}else if(b.id==='prev-card'||b.id==='next-card'){state.cardIdx+=b.id==='next-card'?1:-1;state.flipped=false;render()}else if(b.id==='page-quiz'||b.id==='restart'){startPageQuiz()}else if(b.id==='reveal'){if(state.shown)return;state.input=$('#answer')?.value.trim()||'';let w=state.session[state.idx],expected=currentMode(w)==='en'?w.en:w.ko;let normalize=t=>t.trim().replace(/\s+/g,' ').toLocaleLowerCase();let k=normalize(state.input)===normalize(expected)?'correct':'wrong',r=stat(w);state.stats[w.id]={correct:r.correct+(k==='correct'?1:0),wrong:r.wrong+(k==='wrong'?1:0),recent:[...r.recent,k].slice(-5)};state.sessionResults[k]++;state.verdict=k;state.shown=true;save();render()}else if(b.id==='next'){if(!state.shown)return;state.idx++;state.input='';state.shown=false;state.verdict=null;render()}else if(b.id==='backup'){let blob=new Blob([JSON.stringify({version:2,learned:state.learned,stats:state.stats,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='시험단어장-기록.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}else if(b.id==='import'){$('#restore').click()}});
document.addEventListener('change',async e=>{if(e.target.id==='kind'){state.kind=e.target.value;render()}else if(e.target.id==='restore'){try{let file=e.target.files[0],v=JSON.parse(await file.text());if(!v||![1,2].includes(v.version)||typeof v.learned!=='object'||Array.isArray(v.learned)||v.learned===null||v.version===2&&(typeof v.stats!=='object'||!v.stats))throw Error('invalid');state.learned=v.learned;state.stats=v.version===2?v.stats:{};save();render();notify('기록을 복원했어요')}catch{notify('올바른 백업 파일이 아니에요')}e.target.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='answer'){e.preventDefault();$('#reveal')?.click()}});render();
</script></body></html>
